    <h2> Insert Values into DonateTable </h2>
    <form id="insertDemotable">
        ID: <input type="number" id="insertId" placeholder="Enter ID" required> <br><br>
        TestBranch city: <input type="text" id="branchCity" placeholder="Enter branch city" maxlength="100"> <br><br>
        Branch province: <input type="text" id="branchProvince" placeholder="Enter branch province" maxlength="100"> <br><br>
        donated amount: <input type="number" id="donatedAmount" placeholder="Enter donated amount" maxlength="100">

        <button type="submit"> insert </button> <br>
    </form>
    <div id="insertResultMsg"></div>

    <br><hr><br> <!-- ========================================================================= -->
    <!-- Add this to your HTML file -->
    <h2> Update Volunteer Table</h2>

        <!-- Volunteer Table -->
    <table class="table">
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Role</th>
            <th>Started Date</th>
            <th>Branch City</th>
            <th>Branch Province</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody id="volunteerTableBody">
        <!-- Volunteers will be loaded here -->
        </tbody>
    </table>

    <!-- Update Form -->
    <form id="updateVolunteerForm" style="display: none;">
        <h3>Update Volunteer</h3>

        <div class="form-group">
            <label for="updateVolunteerName">Name:</label>
            <input type="text" id="updateVolunteerName" name="volunteerName" class="form-control">
            <div id="volunteerNameError" class="error-message" style="display: none; color: red;"></div>
        </div>

        <div class="form-group">
            <label for="updateVolunteerRole">Role:</label>
            <select id="updateVolunteerRole" name="volunteerRole" class="form-control">
                <option value="">Select Role</option>
            </select>
        </div>

        <div class="form-group">
            <label for="updateStartedDate">Started Date:</label>
            <input type="date" id="updateStartedDate" name="startedDate" class="form-control">
        </div>

        <div class="form-group">
            <label for="updateBranchCity">Branch City:</label>
            <select id="updateBranchCity" name="branchCity" class="form-control">
                <option value="">Select City</option>
            </select>
        </div>

        <div class="form-group">
            <label for="updateBranchProvince">Branch Province:</label>
            <select id="updateBranchProvince" name="branchProvince" class="form-control">
                <option value="">Select Province</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Update Volunteer</button>
        <button type="button" class="btn btn-secondary" onclick="this.form.style.display='none'">Cancel</button>
    </form>
    <br><hr><br> <!-- ========================================================================= -->
    <h2>Delete Supplies</h2>

    <form id="deleteSuppliesForm">
        <div class="form-group">
            <label for="supplyName">Supply Name:</label>
            <input type="text" id="supplyName" required>
        </div>

        <div class="form-group">
            <label for="deleteBranchCity">Branch City:</label>
            <select id="deleteBranchCity" required>
                <option value="">Select City</option>
            </select>
        </div>

        <div class="form-group">
            <label for="deleteBranchProvince">Branch Province:</label>
            <select id="deleteBranchProvince" required>
                <option value="">Select Province</option>
            </select>
        </div>

        <button type="submit">Delete Supply</button>
    </form>
    <div id="deleteResultMsg"></div>
